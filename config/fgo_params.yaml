microamp_factor_graph_tracking:
  ros__parameters:
    fgo:
      # ==================== BOAT IMU/GNSS PARAMETERS ====================
      # IMU noise (used in preintegration) — from ESKF ModelIMU
      accel_noise: 0.001167    # m/s² white noise std (accm_std=1.167e-3)
      gyro_noise: 0.0000436    # rad/s white noise std (gyro_std=4.36e-5)
      accel_rw: 0.004          # m/s² random walk std (accm_bias_std=4e-3)
      gyro_rw: 0.00005         # rad/s random walk std (gyro_bias_std=5e-5)
      
      # Prior uncertainties (initial graph setup) — from ESKF initial state
      prior_translation_sigma: 0.1 # metres (init ASV pos uncert)
      prior_rotation_sigma: 5    # radians (init ASV orientation uncert)
      prior_vel_sigma: 0.1     # m/s (init ASV vel uncert)
      prior_bias_sigma: 0.001  # IMU gyro bias prior
      prior_accel_bias_sigma: 0.01  # IMU accel bias prior
      
      # GPS measurement noise — from ESKF SensorGNSS_ASV
      gps_sigma_ne: 0.3        # horizontal GPS sigma (metres)
      gps_sigma_d: 0.5         # depth GPS sigma (metres)
      gps_sigma_floor: 0.3     # minimum GPS sigma (metres)
      gps_sigma_max: 50.0      # maximum GPS sigma (metres)
      
      # ==================== ROV PARAMETERS ====================
      # ROV state priors (initial uncertainty when ROV first detected)
      rov_prior_pos_sigma: 2.0     # metres (init ROV pos uncert)
      rov_prior_vel_sigma: 0.5     # m/s (init ROV vel uncert — widened from 0.1)

      # ROV CV process noise.
      # MUST match ESKF ModelCV sigma_a (tracking_and_navigation/tuning_sim.py).
      # Previously set to 0.02 (10x too small), making the FGO 75-100x stiffer
      # in position than the ESKF and unable to track ROV manoeuvres.
      # Q matrix uses the DWPA formulation (dt^4/4 position block) to match ESKF.
      rov_cv_continous_sigma: 0.20  # m/s² — matches ESKF sigma_a=0.20

      # Kept for compatibility; rov_cv_continous_sigma is the active parameter.
      rov_process_vel_sigma: 0.20   # m/s²
      
      # ==================== USBL SENSOR PARAMETERS ====================
      # USBL bearing measurement noise — from ESKF SensorUSBL_Joint
      usbl_azimuth_sigma: 0.01745   # radians (~1 degree)
      usbl_elevation_sigma: 0.01745 # radians (~1 degree)
      
      # Acoustic range measurement noise — from ESKF SensorRange_Joint
      acoustic_range_sigma: 0.5     # metres
      
      # ROV depth sensor noise — from ESKF SensorDepth_ROV
      rov_depth_sigma: 0.3          # metres

      # ==================== BEARING-ONLY STABILISATION ====================
      # Soft depth prior — NOT a real measurement, just a weak constraint to
      # prevent the vertical axis from drifting in bearing-only mode.
      use_rov_depth_prior: true
      rov_depth_prior_mean: 10.0    # nominal Down [m]
      rov_depth_prior_sigma: 10.0   # very weak [m]
