microamp_factor_graph_tracking:
  ros__parameters:
    fgo:
      # ==================== BOAT IMU/GNSS PARAMETERS ====================
      # IMU noise (used in preintegration) — from ESKF ModelIMU
      accel_noise: 4.363e-3    # white noise std (accm_std=1.167e-3)
      gyro_noise: 1.1667e-3
      accel_bias: 4.9e-4         # random walk std (accm_bias_std=4e-3)
      gyro_bias: 2.4e-6         # random walk std (gyro_bias_std=5e-5)
      
      # Prior uncertainties on ASV state when estimated from GPS or ground truth.
      prior_translation_sigma: 1 # metres (init ASV pos uncert)
      prior_rotation_sigma: 5    # radians (init ASV orientation uncert)
      prior_vel_sigma: 0.1     # m/s (init ASV vel uncert)

      prior_accel_bias_sigma: 0.01  # IMU accel bias prior
      prior_gyro_bias_sigma: 0.001  # IMU gyro bias prior 


      # GPS measurement noise — from ESKF SensorGNSS_ASV
      gps_sigma_ne: 1.5        # horizontal GPS sigma (metres)
      gps_sigma_d: 2         # depth GPS sigma (metres)

      # Ground truth initialization option
      init_with_gt: true
      asv_init_pos_gt: [30.0,0.0,0.0]  # ASV ground truth position
      asv_init_vel_gt: [1.5,2.0,0.0]  # ASV ground truth velocity
      asv_init_yaw_gt: 0.9272950380015653  # ASV ground truth yaw (radians)
      rov_init_pos_gt: [34.9999957812502,10.011249998945312,12.003599999784]  # ROV ground truth position
      rov_init_vel_gt: [-0.00016874998358673565,0.2249999358749477,0.07199998686715503]
      
      # ==================== ROV PARAMETERS ====================
      # ROV state priors (initial uncertainty when ROV first detected)
      rov_prior_pos_sigma: 2.0     # metres (init ROV pos uncert)
      rov_prior_vel_sigma: 0.2     # m/s (init ROV vel uncert — widened from 0.1)

      rov_initial_range_guess: 16.4   # initial guess on range from ASV to ROV [m]

      # ROV CV process noise
      rov_cv_continous_sigma: 0.02  # m/s² — matches ESKF sigma_a=0.20
      
      # ==================== USBL SENSOR PARAMETERS ====================
      # USBL bearing measurement noise — from ESKF SensorUSBL_Joint
      usbl_azimuth_sigma: 0.01745   # radians (~1 degree)
      usbl_elevation_sigma: 0.01745 # radians (~1 degree)
      
      # Acoustic range measurement noise — from ESKF SensorRange_Joint
      acoustic_range_sigma: 0.3     # metres
      
      # ROV depth sensor noise — from ESKF SensorDepth_ROV
      rov_depth_sigma: 1.5          # metres
