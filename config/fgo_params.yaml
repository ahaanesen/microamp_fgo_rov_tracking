microamp_factor_graph_tracking:
  ros__parameters:
    fgo:
      # ==================== BOAT IMU/GNSS PARAMETERS ====================
      # IMU noise (used in preintegration)
      accel_noise: 0.01        # m/s² white noise std
      gyro_noise: 0.001        # rad/s white noise std
      accel_rw: 0.0001         # m/s² random walk std
      gyro_rw: 0.00001         # rad/s random walk std
      
      # Prior uncertainties (initial graph setup)
      prior_pose_sigma: 0.01   # metres and radians
      prior_vel_sigma: 0.01    # m/s
      prior_bias_sigma: 0.001  # IMU bias prior
      
      # GPS measurement noise
      gps_sigma_floor: 0.5     # minimum GPS sigma (metres)
      gps_sigma_max: 50.0      # maximum GPS sigma (metres)
      
      # ==================== ROV PARAMETERS ====================
      # ROV state priors (initial uncertainty when ROV first detected)
      rov_prior_pos_sigma: 10.0    # metres (loose — we don't know where ROV is)
      rov_prior_vel_sigma: 1.0     # m/s (assume roughly stationary)
      
      # Constant velocity model process noise
      # This controls how much we allow velocity to change between timesteps
      # Smaller = smoother trajectory, assumes velocity is very constant
      # Larger = allows more velocity variation, adapts faster to maneuvers
      rov_process_vel_sigma: 0.5   # m/s
      
      # ==================== USBL SENSOR PARAMETERS ====================
      # USBL bearing measurement noise (typical USBL accuracy)
      usbl_azimuth_sigma: 0.0524   # radians (~3 degrees)
      usbl_elevation_sigma: 0.0524 # radians (~3 degrees)
      
      # Acoustic range measurement noise
      acoustic_range_sigma: 1.0    # metres (typical for acoustic ranging)
      
      # ROV depth sensor noise (transmitted acoustically)
      rov_depth_sigma: 0.2         # metres (pressure sensor accuracy)
      